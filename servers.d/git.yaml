name: git
enabled: true
command: "/Users/xiivth/workspaces/signs/mcp-server/git/target/release/rust-mcp-git"
args:
  - "--root"
  - "/Users/xiivth/workspaces/signs"
  - "--allow-remote-read"
tool_allowlist:
  - git_list_repositories
  - git_status
  - git_diff
  - git_log
  - git_show
  - git_branches
  - git_history_plan
  - git_validate_merge_readiness
  - git_dev_control_readiness
  - git_amend_commit
  - git_create_branch
  - git_switch
  - git_merge
  - git_delete_branch
  - git_stage
  - git_unstage
  - git_restore
  - git_commit
  - git_tag
  - git_reword_commits
  - git_squash_commits
  - git_verify_unpublished
  - git_rewind_merge
  - git_replace_local_tag
  - git_release_tag
  - git_fetch
  - git_pull
  - git_push
timeout_ms: 30000
restart:
  policy: on-failure
