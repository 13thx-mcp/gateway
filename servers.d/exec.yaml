name: exec
enabled: true
command: "/Users/xiivth/workspaces/signs/mcp-server/bin/exec/rust-mcp-exec"
args:
  - "--root"
  - "/Users/xiivth/workspaces/signs"
  - "--default-timeout-ms"
  - "120000"
  - "--max-timeout-ms"
  - "300000"
  - "--max-output-bytes"
  - "2097152"
env:
  CI: "1"
tool_allowlist:
  - workspace_execute
  - workspace_detect_project
  - workspace_quality_check
timeout_ms: 600000
restart:
  policy: on-failure
